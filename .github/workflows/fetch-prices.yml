name: Fetch Daily Prices

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Fetch prices
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          node - <<'EOF'
          const https = require('https');
          const fs = require('fs');
          
          const ALPHA_VANTAGE_KEY = process.env.ALPHA_VANTAGE_KEY;
          const symbols = ['NVDA', 'GOOGL', 'PANW', 'TSM', 'AAPL', 'AVGO', 'TCEHY', 'ROKU', 'VHYL.AS', 'VUSA.AS', 'BOTZ.L', 'YCSH.AS', 'LYQ2.DE', 'IBCI.DE', 'SXRP.DE', 'EUNL.DE', 'IS3R.DE', 'IS3Q.DE', 'IS3S.DE'];
          
          const prices = {};
          let count = 0;
          
          async function fetchPrice(symbol) {
            return new Promise((resolve) => {
              const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=${ALPHA_VANTAGE_KEY}`;
              https.get(url, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data);
                    if (json['Global Quote'] && json['Global Quote']['05. price']) {
                      prices[symbol] = parseFloat(json['Global Quote']['05. price']);
                      console.log(`✓ ${symbol}`);
                      count++;
                    }
                  } catch (e) {}
                  resolve();
                });
              }).on('error', () => resolve());
              setTimeout(() => resolve(), 5000);
            });
          }
          
          (async () => {
            for (const s of symbols) {
              await fetchPrice(s);
              await new Promise(r => setTimeout(r, 1000));
            }
            fs.writeFileSync('prices.json', JSON.stringify(prices, null, 2));
            console.log(`Saved ${count} prices`);
          })().catch(e => { console.error(e); process.exit(1); });
          EOF
      
      - name: Commit
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add prices.json || true
          git commit -m "Update prices" || true
          git push || true
